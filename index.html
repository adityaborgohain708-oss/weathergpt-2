!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WeatherGPT — Golaghat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#ffffff;
    --bg-1:#f3f6fb;
    --bg-2:#e9eff9;
    --panel:#f7f9fc;
    --panel-line:rgba(20,40,80,0.09);
    --sky-a:#2e6feb;
    --sky-b:#1a9cc2;
    --amber:#e08e00;
    --rain:#2f86d6;
    --text-0:#16233d;
    --text-1:#4c5b76;
    --text-2:#6d7a92;
    --danger:#e8483b;
    --radius-l:22px;
    --radius-m:14px;
    --radius-s:9px;
  }
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); }
  html{ scroll-padding-top:env(safe-area-inset-top, 0px); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background: var(--bg-0);
    color:var(--text-0);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:calc(28px + env(safe-area-inset-top, 0px)) 14px calc(60px + env(safe-area-inset-bottom, 0px));
  }
  .app{
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  /* NAV */
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(135deg, var(--bg-2), var(--bg-1));
    border:1px solid var(--panel-line);
    border-radius:999px;
    padding:10px 8px 10px 16px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.2px;
  }
  .brand .dot{
    width:9px; height:9px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #bfe6ff, var(--sky-b) 60%, var(--sky-a));
    box-shadow:0 0 10px rgba(72,211,232,0.7);
  }
  .brand .gpt{ color:var(--sky-b); }
  .navlinks{ display:flex; gap:2px; }
  .navlinks button{
    all:unset;
    cursor:pointer;
    font-size:11.5px;
    font-weight:600;
    color:var(--text-2);
    padding:8px 10px;
    border-radius:999px;
    transition:background .2s, color .2s;
  }
  .navlinks button.active{ color:var(--bg-0); background:var(--text-0); }
  .navlinks button:not(.active):hover{ color:var(--text-0); }

  /* VIEWS */
  .view{ display:none; flex-direction:column; gap:16px; }
  .view.active{ display:flex; }

  /* HERO */
  .hero{
    position:relative;
    overflow:hidden;
    border-radius:var(--radius-l);
    border:1px solid var(--panel-line);
    background:linear-gradient(160deg, #eaf3ff 0%, #e3edfb 55%, #eef2f9 100%);
    padding:24px 22px 20px;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 82% 18%, rgba(26,156,194,0.16), transparent 42%),
      radial-gradient(circle at 105% 60%, rgba(46,111,235,0.14), transparent 50%);
    pointer-events:none;
  }
  .hero-top{
    position:relative;
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  .hero-date{ font-size:12px; color:var(--text-2); font-weight:600; letter-spacing:.3px; }
  .hero-loc{
    display:flex; align-items:center; gap:5px;
    font-size:13px; color:var(--text-1); font-weight:600; margin-top:4px;
  }
  .refresh-btn{
    all:unset; cursor:pointer;
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(20,40,80,0.06);
    border:1px solid var(--panel-line);
    color:var(--text-1);
  }
  .refresh-btn svg{ width:15px; height:15px; transition:transform .5s; }
  .refresh-btn.spin svg{ transform:rotate(360deg); }

  .hero-main{
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    margin-top:14px;
  }
  .temp-block .temp{
    font-family:'Space Grotesk',sans-serif;
    font-size:68px; font-weight:600; line-height:1;
    letter-spacing:-2px;
  }
  .temp-block .cond{
    font-size:15px; color:var(--text-1); font-weight:500; margin-top:6px;
  }
  .temp-block .feels{
    font-size:12px; color:var(--text-2); margin-top:3px;
  }
  .hero-icon{ width:86px; height:86px; }

  .hero-strip{
    position:relative;
    display:flex; justify-content:space-between;
    margin-top:20px; padding-top:14px;
    border-top:1px solid var(--panel-line);
  }
  .hero-strip .item{ text-align:center; }
  .hero-strip .item .label{ font-size:9.5px; color:var(--text-2); text-transform:uppercase; letter-spacing:.6px; font-weight:600; }
  .hero-strip .item .val{ font-size:13px; color:var(--text-0); font-weight:600; margin-top:5px; }

  /* SECTION HEADERS */
  .sec-head{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:0 2px;
  }
  .sec-head h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:14.5px; font-weight:600; color:var(--text-0);
  }
  .sec-head .more{ font-size:11.5px; color:var(--sky-b); font-weight:600; cursor:pointer; }

  /* HOURLY */
  .hourly-scroll{
    display:flex; gap:10px; overflow-x:auto; padding:4px 2px 6px;
    scrollbar-width:none;
  }
  .hourly-scroll::-webkit-scrollbar{ display:none; }
  .hcard{
    flex:0 0 auto;
    width:60px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:var(--radius-m);
    padding:12px 0 10px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .hcard.now{ border-color:rgba(72,211,232,0.5); background:linear-gradient(180deg, rgba(46,111,235,0.18), var(--panel)); }
  .hcard .t{ font-size:10.5px; color:var(--text-2); font-weight:600; }
  .hcard.now .t{ color:var(--sky-b); }
  .hcard svg{ width:22px; height:22px; }
  .hcard .v{ font-size:13px; font-weight:600; }
  .hcard .p{ font-size:9px; color:var(--rain); font-weight:600; }

  /* DETAILS GRID */
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .dcard{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:var(--radius-m);
    padding:14px 14px 12px;
    position:relative;
    overflow:hidden;
  }
  .dcard .dc-top{ display:flex; align-items:center; gap:7px; }
  .dcard .dc-top svg{ width:15px; height:15px; color:var(--sky-b); }
  .dcard .dc-label{ font-size:10.5px; color:var(--text-2); font-weight:600; letter-spacing:.3px; text-transform:uppercase; }
  .dcard .dc-val{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:600; margin-top:10px; }
  .dcard .dc-sub{ font-size:11px; color:var(--text-2); margin-top:3px; }
  .bar-track{ height:5px; border-radius:4px; background:rgba(20,40,80,0.08); margin-top:10px; overflow:hidden;}
  .bar-fill{ height:100%; border-radius:4px; }
  .uv-scale{ display:flex; gap:2px; margin-top:10px; }
  .uv-scale span{ flex:1; height:5px; border-radius:3px; background:rgba(20,40,80,0.09); }
  .uv-scale span.on{ background:var(--amber); }
  .compass{ width:46px; height:46px; margin-top:6px; }

  /* ASSAM REGIONAL MAP */
  .region-map{
    border-radius:var(--radius-m);
    overflow:hidden;
    border:1px solid var(--panel-line);
    background:var(--panel);
  }
  .region-map img{ display:block; width:100%; height:auto; }
  .region-map .rm-cap{ font-size:11px; color:var(--text-2); padding:8px 12px 10px; }
  .region-map .rm-wrap{ position:relative; line-height:0; }
  .region-map .zone{
    position:absolute; width:16px; height:16px; margin:-8px 0 0 -8px;
    border-radius:50%; border:2px solid rgba(255,255,255,0.9);
    box-shadow:0 0 0 3px rgba(0,0,0,0.12);
  }
  .region-map .zone::after{
    content:''; position:absolute; inset:-6px; border-radius:50%;
    border:2px solid currentColor; opacity:.55; animation:zonePulse 2.2s ease-out infinite;
  }
  .region-map .zone.severe{ background:#ff6a5f; color:#ff6a5f; }
  .region-map .zone.watch{ background:#f5a623; color:#f5a623; }
  .region-map .zone.normal{ background:#48d3e8; color:#48d3e8; }
  .region-map .zone.safe{ background:#54e6a4; color:#54e6a4; }
  @keyframes zonePulse{ 0%{ transform:scale(.6); opacity:.7; } 100%{ transform:scale(1.6); opacity:0; } }
  .region-map .zone-legend{ display:flex; flex-wrap:wrap; gap:10px 14px; padding:10px 12px 12px; font-size:10.5px; color:var(--text-2); }
  .region-map .zone-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .region-map .zone-legend i{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  .hist-toggle{ display:flex; gap:6px; margin:2px 0 12px; }
  .hist-toggle button{
    all:unset; cursor:pointer; flex:1; text-align:center; font-size:11.5px; font-weight:600;
    padding:8px 0; border-radius:10px; background:rgba(20,40,80,0.05); color:var(--text-1);
  }
  .hist-toggle button.active{ background:var(--sky-b); color:#03101f; }
  .hist-chart-wrap{ background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--radius-m); padding:14px 12px 8px; }
  .hist-empty{ font-size:11.5px; color:var(--text-2); padding:20px 4px; text-align:center; }
  .hist-legend{ display:flex; gap:14px; font-size:10.5px; color:var(--text-2); padding:8px 4px 2px; }
  .hist-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .hist-legend i{ width:10px; height:3px; border-radius:2px; display:inline-block; }

  /* 7 DAY */
  .daylist{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:var(--radius-m);
    overflow:hidden;
  }
  .drow{
    display:grid; grid-template-columns:64px 1fr auto 74px;
    align-items:center; gap:10px;
    padding:12px 14px;
    border-bottom:1px solid var(--panel-line);
  }
  .drow:last-child{ border-bottom:none; }
  .drow .dname{ font-size:13px; font-weight:600; }
  .drow .dname.today{ color:var(--sky-b); }
  .drow svg{ width:20px; height:20px; justify-self:center; }
  .drow .rain{ font-size:10.5px; color:var(--rain); font-weight:600; }
  .drow .range{ display:flex; align-items:center; gap:6px; justify-self:end; }
  .drow .lo{ font-size:12px; color:var(--text-2); width:22px; text-align:right; }
  .drow .hi{ font-size:12px; font-weight:700; width:22px; }
  .range-track{ width:34px; height:4px; border-radius:3px; background:rgba(20,40,80,0.1); position:relative; overflow:hidden; }
  .range-fill{ position:absolute; top:0; bottom:0; border-radius:3px; background:linear-gradient(90deg, var(--sky-b), var(--amber)); }

  /* ALERT BANNER */
  .alert-banner{
    display:flex; gap:10px; align-items:flex-start;
    background:linear-gradient(135deg, rgba(255,106,95,0.16), rgba(255,106,95,0.04));
    border:1px solid rgba(255,106,95,0.35);
    border-radius:var(--radius-m);
    padding:13px 14px;
  }
  .alert-banner svg{ width:18px; height:18px; color:var(--danger); flex:0 0 auto; margin-top:1px; }
  .alert-banner .at{ font-size:12.5px; font-weight:700; color:#b3261a; }
  .alert-banner .ad{ font-size:11.5px; color:var(--text-1); margin-top:3px; line-height:1.4; }

  /* EMERGENCY SIREN BAR (sticky, top of app) */
  #emergencyBar{
    display:none;
    position:sticky; top:0; z-index:50;
    background:linear-gradient(135deg,#ff3b30,#b3160e);
    border-radius:var(--radius-m);
    padding:14px 14px;
    box-shadow:0 8px 24px rgba(255,59,48,0.35);
    animation:siren-flash 1.1s ease-in-out infinite;
  }
  #emergencyBar.show{ display:block; }
  @keyframes siren-flash{
    0%,100%{ box-shadow:0 8px 24px rgba(255,59,48,0.35); }
    50%{ box-shadow:0 8px 34px rgba(255,59,48,0.85); }
  }
  .eb-top{ display:flex; align-items:center; gap:9px; }
  .eb-top svg{ width:20px; height:20px; color:#fff; flex:0 0 auto; }
  .eb-title{ font-size:13px; font-weight:800; color:#fff; letter-spacing:.2px; }
  .eb-sub{ font-size:11.5px; color:#ffe1de; margin-top:2px; }
  .eb-actions{ display:flex; gap:8px; margin-top:12px; }
  .eb-btn{ all:unset; cursor:pointer; flex:1; text-align:center; font-size:12px; font-weight:700; padding:10px 0; border-radius:10px; }
  .eb-call{ background:#fff; color:#b3160e; display:flex; align-items:center; justify-content:center; gap:6px; }
  .eb-call svg{ width:14px; height:14px; color:#b3160e; }
  .eb-mute{ background:rgba(255,255,255,0.18); color:#fff; border:1px solid rgba(255,255,255,0.35); }
  .eb-note{ font-size:9.5px; color:#ffd6d2; margin-top:9px; line-height:1.4; }

  /* HAZARD / RED ZONE MAP */
  .hazard-card{ background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--radius-m); padding:14px; }
  .hazard-map{ position:relative; width:100%; height:150px; border-radius:var(--radius-s); overflow:hidden; background:radial-gradient(circle at 50% 50%, #12213f, #060d1c 75%); margin-top:10px; border:1px solid var(--panel-line); }
  .hazard-map svg{ width:100%; height:100%; }
  .hz-ring{ fill:none; stroke:var(--panel-line); }
  .hz-zone{ opacity:.55; }
  .hz-dot{ }
  .hazard-legend{ display:flex; gap:14px; margin-top:10px; flex-wrap:wrap; }
  .hazard-legend div{ display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--text-2); font-weight:600; }
  .hazard-legend span{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .hazard-list{ margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .hz-row{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; background:rgba(20,40,80,0.05); }
  .hz-badge{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .hz-row .hzn{ font-size:12px; font-weight:600; flex:1; }
  .hz-row .hzd{ font-size:11px; color:var(--text-2); }

  /* ESCAPE DIRECTION */
  .escape-card{ margin-top:12px; background:rgba(84,230,164,0.08); border:1px solid rgba(84,230,164,0.3); border-radius:12px; padding:12px 13px; }
  .escape-top{ display:flex; gap:10px; align-items:flex-start; }
  .escape-top svg{ width:18px; height:18px; flex:0 0 auto; margin-top:1px; }
  .escape-t{ font-size:12.5px; font-weight:700; color:var(--text-0); }
  .escape-t b{ color:#54e6a4; }
  .escape-s{ font-size:11.5px; color:var(--text-1); margin-top:3px; line-height:1.4; }
  .escape-note{ font-size:9.5px; color:var(--text-2); margin-top:9px; line-height:1.4; }

  /* COMMENTS */
  .comment-card{ background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--radius-m); padding:14px; }
  .comment-form{ display:flex; gap:8px; }
  .comment-form input{ flex:1; background:rgba(20,40,80,0.05); border:1px solid var(--panel-line); border-radius:999px; padding:10px 14px; color:var(--text-0); font-size:12.5px; font-family:inherit; outline:none; }
  .comment-form input::placeholder{ color:var(--text-2); }
  .comment-form button{ all:unset; cursor:pointer; padding:0 16px; border-radius:999px; background:linear-gradient(135deg, var(--sky-b), var(--sky-a)); color:#03101f; font-size:12px; font-weight:700; display:flex; align-items:center; }
  .comment-list{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }
  .comment{ display:flex; gap:10px; }
  .comment .cav{ width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg, var(--sky-a), var(--sky-b)); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#03101f; flex:0 0 auto; }
  .comment .cbody{ flex:1; background:rgba(20,40,80,0.05); border-radius:12px; border-top-left-radius:4px; padding:8px 12px; }
  .comment .cname{ font-size:11.5px; font-weight:700; color:var(--text-0); }
  .comment .ctime{ font-size:9.5px; color:var(--text-2); font-weight:600; margin-left:6px; }
  .comment .ctext{ font-size:12px; color:var(--text-1); margin-top:3px; line-height:1.4; }
  .comment-empty{ font-size:11.5px; color:var(--text-2); text-align:center; padding:14px 0; }
  .comment-form button#commentPhotoBtn{ background:rgba(20,40,80,0.06); color:var(--text-1); padding:0 12px; font-size:14px; }
  .comment-photo-preview{ position:relative; display:inline-flex; margin-top:10px; }
  .comment-photo-preview img{ width:64px; height:64px; object-fit:cover; border-radius:10px; border:1px solid var(--panel-line); }
  .comment-photo-preview button{ all:unset; cursor:pointer; position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff; font-size:10px; line-height:18px; text-align:center; }
  .comment .cphoto{ margin-top:7px; width:100%; max-width:230px; max-height:170px; object-fit:cover; border-radius:10px; display:block; border:1px solid var(--panel-line); cursor:pointer; }
  .photo-lightbox{ position:fixed; inset:0; background:rgba(3,10,20,0.9); z-index:999; display:none; align-items:center; justify-content:center; padding:28px; }
  .photo-lightbox img{ max-width:100%; max-height:100%; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,0.5); }

  /* ONLINE COUNTER */
  .online-pill{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; color:var(--text-1); background:rgba(84,230,164,0.1); border:1px solid rgba(84,230,164,0.3); padding:5px 10px; border-radius:999px; }
  .online-pill .pulse{ width:6px; height:6px; border-radius:50%; background:#54e6a4; box-shadow:0 0 6px #54e6a4; animation:pulse-dot 1.4s ease-in-out infinite; }
  @keyframes pulse-dot{ 0%,100%{ opacity:1;} 50%{ opacity:.35;} }

  /* SAFETY CHECK-IN BOARD */
  .status-card{ background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--radius-m); padding:14px; }
  .status-stats{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px; }
  .stat-box{ background:rgba(20,40,80,0.05); border-radius:10px; padding:10px 6px; text-align:center; }
  .stat-box .sv{ font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; }
  .stat-box .sl{ font-size:9px; color:var(--text-2); font-weight:600; margin-top:2px; text-transform:uppercase; letter-spacing:.3px; }
  .stat-box.safe .sv{ color:#54e6a4; }
  .stat-box.help .sv{ color:var(--danger); }
  .stat-box.wait .sv{ color:var(--text-2); }
  .checkin-actions{ display:flex; gap:8px; margin-top:12px; }
  .checkin-actions button{ all:unset; cursor:pointer; flex:1; text-align:center; font-size:11.5px; font-weight:700; padding:10px 0; border-radius:10px; }
  .btn-safe{ background:rgba(84,230,164,0.18); color:#54e6a4; border:1px solid rgba(84,230,164,0.5); box-shadow:0 0 0 rgba(84,230,164,0); transition:box-shadow .2s; }
  .btn-safe:hover{ box-shadow:0 0 12px rgba(84,230,164,0.35); }
  .btn-help{ background:rgba(255,106,95,0.18); color:var(--danger); border:1px solid rgba(255,106,95,0.5); box-shadow:0 0 0 rgba(255,106,95,0); transition:box-shadow .2s; }
  .btn-help:hover{ box-shadow:0 0 12px rgba(255,106,95,0.35); }
  .status-list{ margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .status-row{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; background:rgba(20,40,80,0.05); }
  .status-row .sdot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .status-row .sname{ font-size:12px; font-weight:600; flex:1; }
  .status-row .sloc{ font-size:10px; color:var(--text-2); display:block; margin-top:1px; }
  .status-row .stag{ font-size:9.5px; font-weight:700; padding:3px 8px; border-radius:999px; }
  .tag-safe{ background:rgba(84,230,164,0.15); color:#54e6a4; }
  .tag-help{ background:rgba(255,106,95,0.15); color:var(--danger); }
  .tag-wait{ background:rgba(20,40,80,0.08); color:var(--text-2); }
  .status-note{ font-size:9.5px; color:var(--text-2); margin-top:11px; line-height:1.4; }

  /* FORECAST OUTLOOK CARD */
